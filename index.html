<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTU Login - Fixed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }
        .wrapper {
            width: 380px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            color: #333;
            border-radius: 16px;
            padding: 25px 30px;
            margin: 20px;
        }
        .wrapper h1 {
            font-size: 26px;
            text-align: center;
            margin-bottom: 20px;
            color: #0f2027;
        }
        .input-box {
            position: relative;
            width: 100%;
            height: 50px;
            margin: 20px 0;
        }
        .input-box input {
            width: 100%;
            height: 100%;
            background: #f4f6f9;
            border: 2px solid #ccc;
            outline: none;
            border-radius: 30px;
            font-size: 15px;
            color: #333;
            padding: 0 20px;
        }
        .input-box input:focus {
            border-color: #007bff;
        }
        .input-box input::placeholder {
            color: #888;
        }
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin: 10px 0 20px;
            color: #555;
        }
        .remember-forgot a {
            color: #007bff;
            text-decoration: none;
        }
        .btn {
            width: 100%;
            height: 45px;
            background: #007bff;
            border: none;
            outline: none;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
            cursor: pointer;
            font-size: 16px;
            color: #fff;
            font-weight: bold;
        }
        .register-link {
            font-size: 13px;
            text-align: center;
            margin-top: 20px;
            color: #555;
        }
        .register-link p a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <form action="">
            <h1>Login</h1>
            <div class="input-box">
                <input type="text" placeholder="Username" required>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password" required>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="btn">Login</button>
            <div class="register-link">
                <p>Don't have an account? <a href="#">Register</a></p>
            </div>
        </form>
    </div>

</body>
</html>
