<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arewa Data Plus - Mobile VTU App</title>
    <style>
        :root {
            --primary: #0E6251;
            --accent: #F39C12;
            --bg: #F4F6F7;
            --dark: #1E293B;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }

        body { background-color: #0d1117; display: flex; justify-content: center; min-height: 100vh; }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Top Header */
        .app-header {
            background: linear-gradient(135deg, var(--primary), #0A4337);
            color: #fff;
            padding: 25px 20px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .brand-row { display: flex; justify-content: space-between; align-items: center; }
        .brand-title { font-size: 20px; font-weight: bold; }
        .badge { background: var(--accent); color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: bold; }

        /* Wallet Card */
        .wallet-card {
            background: #1A252F;
            color: #fff;
            margin: -20px 20px 15px 20px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .bal-val { font-size: 28px; font-weight: bold; color: var(--accent); margin: 5px 0; }
        .topup-btn { background: var(--primary); color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; float: right; }

        /* Services Grid */
        .section-title { font-weight: bold; font-size: 14px; margin: 15px 20px 10px 20px; color: var(--dark); }
        .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 20px; }

        .service-card {
            background: #fff;
            border: 1px solid #E5E7E9;
            padding: 15px 10px;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .service-card:active { transform: scale(0.95); background: #E8F8F5; }
        .service-icon { font-size: 26px; margin-bottom: 5px; }
        .service-name { font-size: 12px; font-weight: 600; color: var(--dark); }

        .btn-main {
            background: var(--primary);
            color: #fff;
            border: none;
            margin: 20px;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Modal Popup Screen */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 450px;
            padding: 25px 20px;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: var(--primary); }
        .form-group { margin-bottom: 15px; }
        .form-group label { font-size: 12px; font-weight: bold; display: block; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #BDC3C7; border-radius: 8px; font-size: 14px; outline: none; }

        /* Bottom Nav */
        .bottom-nav {
            margin-top: auto;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            background: #fff;
            border-top: 1px solid #E5E7E9;
            font-size: 12px;
            font-weight: 600;
        }
        .nav-item { text-align: center; color: #7F8C8D; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="app-header">
        <div class="brand-row">
            <div class="brand-title">📱 Arewa Data Plus</div>
            <span class="badge">PRO APP</span>
        </div>
        <div style="font-size: 11px; opacity: 0.8; margin-top: 5px;">Mafi Sauri & Amana wajen Data/Airtime</div>
    </div>

    <!-- Wallet Balance -->
    <div class="wallet-card">
        <button class="topup-btn" onclick="alert('Lambar Account dinka na Moniepoint: 8123456789')">+ Add Money</button>
        <div style="font-size: 11px; color: #BDC3C7;">AVAILABLE BALANCE</div>
        <div class="bal-val">₦15,400.00</div>
        <div style="font-size: 11px; color: #2ECC71;">● Virtual Account Active</div>
    </div>

    <!-- Quick Services -->
    <div class="section-title">Ayyukan Mu (Services)</div>
    <div class="services-grid">
        <div class="service-card" onclick="openBuyModal('Data')">
            <div class="service-icon">📶</div>
            <div class="service-name">Buy Data</div>
        </div>
        <div class="service-card" onclick="openBuyModal('Airtime')">
            <div class="service-icon">📞</div>
            <div class="service-name">Airtime</div>
        </div>
        <div class="service-card" onclick="alert('Za a buɗe Cable TV!')">
            <div class="service-icon">📺</div>
            <div class="service-name">Cable TV</div>
        </div>
        <div class="service-card" onclick="alert('Za a buɗe Electricity!')">
            <div class="service-icon">💡</div>
            <div class="service-name">Electricity</div>
        </div>
        <div class="service-card" onclick="openBuyModal('Bulk Data')">
            <div class="service-icon">📦</div>
            <div class="service-name">Bulk Data</div>
        </div>
        <div class="service-card" onclick="alert('Shafin Transactions History')">
            <div class="service-icon">📜</div>
            <div class="service-name">History</div>
        </div>
    </div>

    <button class="btn-main" onclick="openBuyModal('Data')">Siyi Data Yanzu</button>

    <!-- Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active">🏠<br>Home</div>
        <div class="nav-item" onclick="alert('History Screen')">📊<br>Orders</div>
        <div class="nav-item" onclick="alert('Wallet Topup')">💳<br>Wallet</div>
        <div class="nav-item" onclick="alert('Profile Settings')">👤<br>Profile</div>
    </div>
</div>

<!-- Modal Form Popup -->
<div class="modal-overlay" id="buyModal">
    <div class="modal-content">
        <div class="modal-title" id="modalHeader">Sayan Data</div>
        
        <div class="form-group">
            <label>Zaɓi Network:</label>
            <select class="form-control" id="networkSelect">
                <option>MTN SME / Direct</option>
                <option>Airtel CG</option>
                <option>Glo Data</option>
                <option>9mobile Gifting</option>
            </select>
        </div>

        <div class="form-group">
            <label>Zaɓi Tsarin Data (Plan):</label>
            <select class="form-control">
                <option>1GB - ₦280 (30 Days)</option>
                <option>2GB - ₦560 (30 Days)</option>
                <option>5GB - ₦1,400 (30 Days)</option>
                <option>10GB - ₦2,800 (30 Days)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Lambar Waya (Phone Number):</label>
            <input type="tel" class="form-control" placeholder="08012345678">
        </div>

        <div class="form-group">
            <label>PIN din Sirri (4 Digits):</label>
            <input type="password" class="form-control" placeholder="****" maxlength="4">
        </div>

        <button class="btn-main" style="width: 100%; margin: 10px 0 0 0;" onclick="processTransaction()">Tura Yanzu (Submit)</button>
        <button style="width: 100%; background: none; border: none; padding: 10px; color: #7F8C8D; font-weight: bold; cursor: pointer;" onclick="closeBuyModal()">Soke (Cancel)</button>
    </div>
</div>

<script>
    function openBuyModal(type) {
        document.getElementById('modalHeader').innerText = 'Sayan ' + type;
        document.getElementById('buyModal').style.display = 'flex';
    }

    function closeBuyModal() {
        document.getElementById('buyModal').style.display = 'none';
    }

    function processTransaction() {
        alert('An tura aikin ku cikin nasara! Za a tura muku Data da kuke bukata.');
        closeBuyModal();
    }
</script>

</body>
</html>
