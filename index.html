<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTU Dashboard Sample</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .wallet-card {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        .wallet-card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #dcdcdc;
        }
        .balance {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .btn {
            background-color: #ff9800;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="wallet-card">
        <h3>Maraba, Hashimu</h3>
        <div class="balance">₦5,450.00</div>
        <button class="btn">+ Ƙara Kuɗi (Fund Wallet)</button>
    </div>

</body>
</html>
