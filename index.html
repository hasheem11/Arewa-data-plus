<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arewa Data Plus - Fast & Reliable VTU Platform</title>
    <style>
        :root {
            --primary-color: #0E6251; /* Royal Emerald */
            --accent-gold: #F39C12;    /* Premium Gold Accent */
            --bg-color: #F4F6F7;
            --text-dark: #2C3E50;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-dark);
        }

        .app-container {
            max-width: 450px;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.08);
        }

        /* Top Header */
        .app-header {
            background: linear-gradient(135deg, var(--primary-color), #0B463A);
            color: #ffffff;
            padding: 25px 20px 35px 20px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .badge-plus {
            background: var(--accent-gold);
            color: #fff;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
        }

        /* Balance Display Card */
        .balance-card {
            background: #1A252F;
            color: #ffffff;
            margin: -25px 20px 20px 20px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .balance-title { font-size: 12px; color: #BDC3C7; text-transform: uppercase; }
        .balance-amount { font-size: 30px; font-weight: bold; color: var(--accent-gold); margin: 6px 0; }
        .virtual-account { font-size: 12px; color: #2ECC71; font-weight: 500; }

        /* Grid Services */
        .section-title { font-weight: bold; font-size: 15px; margin: 0 20px 12px 20px; }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 0 20px;
        }

        .service-box {
            background: #FAFAFA;
            border: 1px solid #E5E7E9;
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
        }

        .service-box:hover {
            border-color: var(--primary-color);
            background: #E8F8F5;
        }

        .service-icon { font-size: 26px; margin-bottom: 6px; }
        .service-label { font-size: 12px; font-weight: 600; }

        /* Action Button */
        .action-btn {
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            margin: 25px 20px;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(14, 98, 81, 0.3);
        }

        /* Bottom Nav */
        .bottom-nav {
            margin-top: auto;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #E5E7E9;
            background: #ffffff;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="app-header">
        <div class="brand-name">
            📲 Arewa Data Plus
            <span class="badge-plus">OFFICIAL</span>
        </div>
        <div style="font-size: 12px; opacity: 0.85; margin-top: 4px;">Tsarin Sayan Data & Airtime Mafi Sauri</div>
    </div>

    <!-- Balance Card -->
    <div class="balance-card">
        <div class="balance-title">Asusunku (Available Balance)</div>
        <div class="balance-amount">₦0.00</div>
        <div class="virtual-account">● Bank Account: PalmPay / Wema (Automated)</div>
    </div>

    <!-- Services -->
    <div class="section-title">Ayyukan Mu (Services)</div>
    <div class="services-grid">
        <div class="service-box" onclick="alert('Sayan Data na Arewa Data Plus')">
            <div class="service-icon">📶</div>
            <div class="service-label">Buy Data</div>
        </div>
        <div class="service-box">
            <div class="service-icon">📞</div>
            <div class="service-label">Airtime</div>
        </div>
        <div class="service-box">
            <div class="service-icon">📺</div>
            <div class="service-label">Cable TV</div>
        </div>
        <div class="service-box">
            <div class="service-icon">💡</div>
            <div class="service-label">Electricity</div>
        </div>
        <div class="service-box">
            <div class="service-icon">📦</div>
            <div class="service-label">Bulk Data</div>
        </div>
        <div class="service-box">
            <div class="service-icon">📑</div>
            <div class="service-label">History</div>
        </div>
    </div>

    <button class="action-btn" onclick="alert('Za a bude shafin sayan data yanzu...')">Siyi Data Yanzu</button>

    <!-- Navigation Bar -->
    <div class="bottom-nav">
        <div>🏠 Home</div>
        <div>📊 Orders</div>
        <div>💳 Wallet</div>
        <div>👤 Profile</div>
    </div>
</div>

</body>
</html>
